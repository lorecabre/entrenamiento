  <style>
    :root{--bg:#121411;--panel:#1c201b;--panel2:#252a24;--line:#363c34;--text:#f2f4ed;--muted:#a8b0a3;--lime:#d7ff52;--limeink:#172011;--green:#82d66d;--gold:#ffd76a;--danger:#ff9d8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:740px;margin:auto;min-height:100vh;padding:22px 16px 100px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:650}.top h1{font-size:27px;line-height:1.1;margin:4px 0 0;font-weight:650;letter-spacing:-.04em}.date{color:var(--muted);font-size:13px;padding-top:6px;white-space:nowrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.card h2,.card h3{margin:0}.card h2{font-size:18px;letter-spacing:-.02em}.card h3{font-size:15px}.sub{color:var(--muted);font-size:13px;margin:5px 0 0}.primary,.secondary,.ghost,.danger{border-radius:11px;padding:12px 14px;border:0;font-weight:700;letter-spacing:.01em}.primary{background:var(--lime);color:var(--limeink)}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.ghost{background:transparent;color:var(--lime);padding:5px 0}.danger{background:transparent;color:var(--danger);padding:5px 0}.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:var(--panel2);border-radius:12px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:22px;margin-top:3px;letter-spacing:-.04em}.tabs{position:fixed;bottom:0;left:0;right:0;background:#171a16eF;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:3}.tabs-inner{width:min(740px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 10px 10px}.tab{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;gap:3px;padding:6px 2px;font-size:11px}.tab span{font-size:18px}.tab.active{color:var(--lime)}.group-grid{display:grid;gap:10px}.group{width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text)}.group strong{display:block;font-size:17px}.group small{display:block;color:var(--muted);margin-top:4px}.group.selected{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}.exercise{border-top:1px solid var(--line);padding:17px 0}.exercise:first-child{border-top:0;padding-top:0}.exercise-title{font-weight:700;font-size:17px;letter-spacing:-.02em}.exercise-meta{color:var(--muted);font-size:12px;margin:4px 0 12px}.set-head,.set{display:grid;grid-template-columns:36px 1.45fr 1fr .8fr 35px;gap:6px;align-items:center}.set-head{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin:8px 0}.set{min-height:44px;margin:4px 0}.set select,.set input,.note{width:100%;min-width:0;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 7px}.set.done{color:#dce2d7}.check{border:0;width:31px;height:31px;border-radius:50%;background:var(--lime);color:var(--limeink);font-size:17px;font-weight:800}.checked{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#253a22;color:var(--green);border:1px solid #466443;font-weight:800}.mini{font-size:12px;padding:8px 10px}.suggestions{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.suggestion{min-width:190px;background:var(--panel2);border-radius:12px;padding:12px}.suggestion strong{display:block;font-size:14px}.suggestion small{color:var(--muted);display:block;margin:5px 0 10px}.library-item{width:100%;border:0;background:transparent;border-top:1px solid var(--line);color:var(--text);padding:14px 0;text-align:left;display:flex;justify-content:space-between;align-items:center}.library-item:first-of-type{border-top:0}.library-item small{display:block;color:var(--muted);margin-top:3px}.search{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;margin:0 0 10px}.tag{display:inline-block;background:#273022;color:#c9f35b;padding:4px 7px;border-radius:7px;font-size:11px;font-weight:650}.week{display:flex;gap:5px;margin-top:15px}.day{flex:1;text-align:center;color:var(--muted);font-size:11px}.dot{height:26px;width:26px;border-radius:50%;background:var(--panel2);margin:6px auto}.dot.yes{display:grid;place-items:center;background:var(--lime);color:var(--limeink);font-weight:800}.bar-row{display:grid;grid-template-columns:80px 1fr 42px;gap:9px;align-items:center;margin:10px 0;font-size:12px}.track{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--lime);border-radius:inherit}.modal{position:fixed;inset:0;background:#000a;display:grid;align-items:end;z-index:6}.sheet{max-width:740px;width:100%;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 16px 28px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 8px}.field-label{display:block;color:var(--muted);font-size:12px;margin:14px 0 5px}.toast{position:fixed;z-index:10;left:50%;bottom:78px;transform:translateX(-50%);background:#293123;color:var(--lime);border:1px solid #526647;padding:10px 14px;border-radius:99px;font-size:13px;box-shadow:0 8px 20px #0007}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.history{padding:13px 0;border-top:1px solid var(--line)}.history:first-child{border-top:0}.pr{color:var(--gold);font-size:12px;margin-top:6px}@media(max-width:390px){.app{padding-inline:12px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:19px}.set-head,.set{grid-template-columns:29px 1.35fr .9fr .68fr 30px;gap:4px}.set select{padding-inline:4px;font-size:13px}}
  </style>
</head>
<body><main id="app" class="app"></main><nav class="tabs"><div class="tabs-inner"><button class="tab" data-tab="inicio"><span>⌂</span>Inicio</button><button class="tab" data-tab="entrenar"><span>◉</span>Entrenar</button><button class="tab" data-tab="progreso"><span>↗</span>Progreso</button><button class="tab" data-tab="biblioteca"><span>▤</span>Biblioteca</button></div></nav><div id="overlay"></div>
<script>
const KEY='entrenamiento-v1';
const library=[
 // Tren superior
 {g:'Tren superior',c:'Pecho',n:'Press de banca',v:['Barra','Mancuernas']},{g:'Tren superior',c:'Pecho',n:'Press inclinado',v:['Barra','Mancuernas']},{g:'Tren superior',c:'Pecho',n:'Press declinado',v:['Barra','Mancuernas']},{g:'Tren superior',c:'Pecho',n:'Press de pecho en máquina mariposa',v:['Máquina']},{g:'Tren superior',c:'Pecho',n:'Aperturas',v:['Mancuernas']},{g:'Tren superior',c:'Pecho',n:'Cruce de poleas',v:['Polea']},{g:'Tren superior',c:'Pecho',n:'Flexiones',v:['Convencionales','Inclinadas']},{g:'Tren superior',c:'Pecho',n:'Fondos en paralelas',v:['Énfasis pecho']},
 {g:'Tren superior',c:'Espalda',n:'Jalón al pecho',v:['Agarre ancho','Agarre cerrado']},{g:'Tren superior',c:'Espalda',n:'Jalón unilateral',v:['Polea']},{g:'Tren superior',c:'Espalda',n:'Dominadas',v:['Pronadas','Agarre supino']},{g:'Tren superior',c:'Espalda',n:'Remo',v:['Barra','Mancuernas','Triángulo en polea']},{g:'Tren superior',c:'Espalda',n:'Remo unilateral',v:['Mancuerna','Polea']},{g:'Tren superior',c:'Espalda',n:'Remo pecho apoyado',v:['Máquina']},{g:'Tren superior',c:'Espalda',n:'Pullover',v:['Mancuerna','Máquina']},{g:'Tren superior',c:'Espalda',n:'Straight-arm pulldown',v:['Polea']},
 {g:'Tren superior',c:'Hombros',n:'Press de hombros',v:['Barra / press militar','Mancuernas / press militar','Máquina','Arnold press']},{g:'Tren superior',c:'Hombros',n:'Elevaciones laterales',v:['Mancuernas','Polea','Unilaterales']},{g:'Tren superior',c:'Hombros',n:'Elevaciones frontales',v:['Mancuernas','Polea']},{g:'Tren superior',c:'Hombros',n:'Pájaros',v:['Mancuernas','Polea']},{g:'Tren superior',c:'Hombros',n:'Reverse Pec Deck',v:['Máquina']},{g:'Tren superior',c:'Hombros',n:'Face pull',v:['Polea']},{g:'Tren superior',c:'Hombros',n:'Remo al mentón',v:['Barra']},
 {g:'Tren superior',c:'Bíceps',n:'Curl / bíceps',v:['Barra','Barra EZ','Mancuernas','Alternado con mancuernas','Banco inclinado','Concentrado','Predicador','Polea','Unilateral en polea']},{g:'Tren superior',c:'Bíceps',n:'Curl martillo',v:['Mancuernas','Cuerda']},
 {g:'Tren superior',c:'Tríceps',n:'Extensión de tríceps',v:['Polea bilateral / ambos brazos','Polea unilateral','Cuerda','Polea con barra corta','Mancuernas','Polea desde atrás']},{g:'Tren superior',c:'Tríceps',n:'Extensión por encima de la cabeza',v:['Mancuerna','Cuerda']},{g:'Tren superior',c:'Tríceps',n:'Press francés',v:['Barra','Mancuernas']},{g:'Tren superior',c:'Tríceps',n:'Press cerrado',v:['Barra']},{g:'Tren superior',c:'Tríceps',n:'Fondos para tríceps',v:['Peso corporal']},
 // Tren inferior
 {g:'Tren inferior',c:'Cuádriceps',n:'Sentadilla con barra / peso libre',v:['Barra']},{g:'Tren inferior',c:'Cuádriceps',n:'Sentadilla frontal',v:['Barra']},{g:'Tren inferior',c:'Cuádriceps',n:'Sentadilla en Smith / multipower',v:['Multipower']},{g:'Tren inferior',c:'Cuádriceps',n:'Sentadilla en máquina péndulo',v:['Máquina péndulo']},{g:'Tren inferior',c:'Cuádriceps',n:'Sentadilla con barra hexagonal',v:['Barra hexagonal']},{g:'Tren inferior',c:'Cuádriceps',n:'Prensa',v:['Prensa']},{g:'Tren inferior',c:'Cuádriceps',n:'Extensión de cuádriceps',v:['Máquina','Unilateral']},{g:'Tren inferior',c:'Cuádriceps',n:'Zancadas',v:['Con mancuernas','Caminando','Atrás']},{g:'Tren inferior',c:'Cuádriceps / Glúteos',n:'Step-up',v:['Convencional','Énfasis glúteos']},{g:'Tren inferior',c:'Cuádriceps / Glúteos',n:'Bulgarian split squat',v:['Libre','Multipower','Énfasis glúteos']},
 {g:'Tren inferior',c:'Glúteos',n:'Hip thrust',v:['Barra','Máquina','Multipower']},{g:'Tren inferior',c:'Glúteos',n:'Patada / extensión de glúteo',v:['Polea · rodilla doblada','Polea · rodilla recta / extendida','Polea · sobre banco','Máquina']},{g:'Tren inferior',c:'Glúteos',n:'Abducción de cadera',v:['Máquina','Polea']},{g:'Tren inferior',c:'Glúteos',n:'Extensión de cadera',v:['Máquina']},{g:'Tren inferior',c:'Glúteos',n:'Pull-through',v:['Polea']},{g:'Tren inferior',c:'Glúteos',n:'Frog pumps',v:['Peso corporal']},
 {g:'Tren inferior',c:'Isquiosurales',n:'Peso muerto rumano',v:['Barra','Mancuernas']},{g:'Tren inferior',c:'Isquiosurales',n:'Peso muerto a una pierna',v:['Mancuernas']},{g:'Tren inferior',c:'Isquiosurales',n:'Curl femoral / máquina de isquiotibiales',v:['Máquina acostado','Máquina de pie']},{g:'Tren inferior',c:'Isquiosurales',n:'Buenos días',v:['Barra']},{g:'Tren inferior',c:'Glúteos · Isquiosurales · Zona lumbar',n:'Hiperextensiones',v:['Banco']},
 {g:'Tren inferior',c:'Aductores',n:'Aductores',v:['Máquina','Polea']},{g:'Tren inferior',c:'Abductores',n:'Abductores',v:['Máquina','Unilateral en polea']},{g:'Tren inferior',c:'Pantorrillas',n:'Elevación de talones',v:['Prensa','Multipower']},
 // Core
 {g:'Core',c:'Abdominales',n:'Crunch en polea',v:['Polea']},{g:'Core',c:'Abdominales',n:'Crunch declinado',v:['Declinado']},{g:'Core',c:'Abdominales',n:'Sit-up',v:['Peso corporal']},{g:'Core',c:'Abdominales',n:'Sit-up con peso',v:['Con peso']},{g:'Core',c:'Abdominales',n:'Elevación de piernas',v:['Suelo']},{g:'Core',c:'Abdominales',n:'Elevación de piernas colgado',v:['Colgado']},{g:'Core',c:'Oblicuos',n:'Crunch lateral',v:['Peso corporal']},{g:'Core',c:'Oblicuos',n:'Russian twist con peso',v:['Con peso']},{g:'Core',c:'Oblicuos',n:'Side bend con mancuerna',v:['Mancuerna']},{g:'Core',c:'Estabilidad',n:'Plancha convencional',v:['Peso corporal']},{g:'Core',c:'Estabilidad',n:'Plancha lateral',v:['Peso corporal']},{g:'Core',c:'Estabilidad',n:'Plancha con apoyo de antebrazos',v:['Antebrazos']},{g:'Core',c:'Estabilidad',n:'Plancha con apoyo de manos',v:['Manos']},{g:'Core',c:'Estabilidad',n:'Plancha con peso',v:['Con peso']},{g:'Core',c:'Estabilidad',n:'Dead bug',v:['Peso corporal']},{g:'Core',c:'Anti-rotación',n:'Pallof press',v:['Polea']},{g:'Core',c:'Zona lumbar · también en Glúteos e Isquiosurales',n:'Hiperextensiones',v:['Banco']},{g:'Core',c:'Otros',n:'Ab wheel / rueda abdominal',v:['Rueda']},{g:'Core',c:'Otros',n:'Toes to bar',v:['Barra']},{g:'Core',c:'Otros',n:'V-ups',v:['Peso corporal']}
];
const historyAliases={
 'Sentadilla|Barra':['Sentadilla con barra / peso libre','Barra'],'Sentadilla|Frontal':['Sentadilla frontal','Barra'],'Sentadilla|Multipower':['Sentadilla en Smith / multipower','Multipower'],'Sentadilla péndulo|Máquina':['Sentadilla en máquina péndulo','Máquina péndulo'],
 'Remo con barra|Barra':['Remo','Barra'],'Remo con mancuernas|Mancuernas':['Remo','Mancuernas'],'Patada de glúteo|Polea':['Patada / extensión de glúteo','Polea · rodilla recta / extendida'],'Patada de glúteo|Máquina':['Patada / extensión de glúteo','Máquina'],
 'Curl femoral|Máquina acostado':['Curl femoral / máquina de isquiotibiales','Máquina acostado'],'Curl femoral|Máquina de pie':['Curl femoral / máquina de isquiotibiales','Máquina de pie'],'Curl|Barra':['Curl / bíceps','Barra'],'Curl|Barra EZ':['Curl / bíceps','Barra EZ'],'Curl|Mancuernas':['Curl / bíceps','Mancuernas'],'Curl|Polea':['Curl / bíceps','Polea'],
 'Crunch|Polea':['Crunch en polea','Polea'],'Crunch|Declinado':['Crunch declinado','Declinado'],'Sit-up|Con peso':['Sit-up con peso','Con peso'],'Elevación de piernas|Colgado':['Elevación de piernas colgado','Colgado'],'Russian twist|Con peso':['Russian twist con peso','Con peso'],'Side bend|Mancuerna':['Side bend con mancuerna','Mancuerna'],'Plancha|Antebrazos':['Plancha con apoyo de antebrazos','Antebrazos'],'Plancha|Manos':['Plancha con apoyo de manos','Manos'],'Plancha|Con peso':['Plancha con peso','Con peso']};
function migrateExercise(e){let next=historyAliases[`${e.name}|${e.variant}`];if(next){e.name=next[0];e.variant=next[1]}return e}
function migrateState(s){if(!s||typeof s!=='object')return{sessions:[],draft:null};s.sessions=Array.isArray(s.sessions)?s.sessions:[];[...s.sessions,s.draft].filter(Boolean).forEach(w=>{w.exercises=(w.exercises||[]).map(migrateExercise);w.prs=(w.prs||[]).map(migrateExercise)});return s}
let state=load(),tab='inicio';
function load(){try{return migrateState(JSON.parse(localStorage.getItem(KEY))||{sessions:[],draft:null})}catch{return{sessions:[],draft:null}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function id(){return Math.random().toString(36).slice(2,10)}function dateLabel(d){return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short'}).format(new Date(d))}function today(){return new Date().toISOString().slice(0,10)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function current(){return state.draft}
function completedSets(s){return s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done&&!x.warm).length,0)}function allSets(s){return s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0)}function weekSessions(){let start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));return state.sessions.filter(s=>new Date(s.date)>=start)}function lastExercise(n,v){let found=[];state.sessions.forEach(s=>s.exercises.forEach(e=>{if(e.name===n&&e.variant===v)e.sets.forEach(x=>{if(x.done&&!x.warm)found.push({...x,date:s.date})})}));return found.sort((a,b)=>new Date(b.date)-new Date(a.date))[0]}
function prFor(n,v){let sets=[];state.sessions.forEach(s=>s.exercises.forEach(e=>{if(e.name===n&&e.variant===v)e.sets.filter(x=>x.done&&!x.warm).forEach(x=>sets.push(x))}));if(!sets.length)return null;return{weight:Math.max(...sets.map(x=>+x.weight||0)),best:sets.reduce((a,x)=>(+x.weight*(1+(+x.reps)/30))>(+a.weight*(1+(+a.reps)/30))?x:a)} }
function header(label,extra=''){return `<header class="top"><div><div class="eyebrow">Entrenamiento</div><h1>${label}</h1></div><div class="date">${extra||dateLabel(today())}</div></header>`}function setOptions(value,type,group=''){if(type==='weight'){let step=group==='Tren superior'?'0.5':'1';return `<input data-field="weight" type="number" min="0" step="${step}" inputmode="decimal" value="${esc(value)}" aria-label="Peso en kilogramos">`}let vals=type==='reps'?Array.from({length:30},(_,i)=>String(i+1)):['0','1','2','3','4','5+','—'];return `<select data-field="${type}">${vals.map(x=>`<option ${String(value)===x?'selected':''}>${x}</option>`).join('')}</select>`}
function render(){let html=tab==='inicio'?home():tab==='entrenar'?train():tab==='progreso'?progress():libraryView();document.querySelector('#app').innerHTML=html;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function home(){let w=weekSessions(),series=w.reduce((a,s)=>a+completedSets(s),0),prs=w.reduce((a,s)=>a+s.prs.length,0);return header('Hola')+`${current()?`<section class="card"><span class="tag">EN CURSO</span><h2 style="margin-top:10px">${esc(current().group)}</h2><p class="sub">${current().exercises.length} ejercicios · ${completedSets(current())} series completadas</p><div class="actions"><button class="primary full" onclick="goTrain()">Continuar entrenamiento</button></div></section>`:`<button class="primary full" onclick="newWorkout()">COMENZAR ENTRENAMIENTO</button>`}<section class="card"><div class="row"><h2>Esta semana</h2><button class="ghost" onclick="setTab('progreso')">Ver progreso</button></div><div class="stats"><div class="stat"><small>Sesiones</small><strong>${w.length}</strong></div><div class="stat"><small>Series</small><strong>${series}</strong></div><div class="stat"><small>PR</small><strong>${prs}</strong></div></div></section><section class="card"><div class="row"><h2>Último entrenamiento</h2></div>${state.sessions.length?sessionSnippet(state.sessions[0]):`<div class="empty">Todavía no hay entrenamientos registrados.</div>`}</section>`}
function sessionSnippet(s){return `<div class="history"><strong>${esc(s.group)}</strong><div class="sub">${dateLabel(s.date)} · ${allSets(s)} series · ${s.exercises.map(e=>esc(e.name)).slice(0,3).join(' · ')}</div>${s.prs.length?`<div class="pr">🏆 ${s.prs.length} PR registrado${s.prs.length>1?'s':''}</div>`:''}</div>`}
function newWorkout(){show(`<h2>Nuevo entrenamiento</h2><p class="sub">Elegí un grupo principal. Después podés añadir ejercicios de cualquier grupo.</p><div class="group-grid" style="margin-top:16px"><button class="group" onclick="startWorkout('Tren superior')"><strong>Tren superior</strong><small>Pecho · Espalda · Hombros · Brazos</small></button><button class="group" onclick="startWorkout('Tren inferior')"><strong>Tren inferior</strong><small>Cuádriceps · Glúteos · Isquios · Gemelos</small></button><button class="group" onclick="startWorkout('Core')"><strong>Core</strong><small>Abdominales · Oblicuos · Estabilidad</small></button></div>`) }function startWorkout(group){state.draft={id:id(),date:today(),started:Date.now(),group,exercises:[],note:''};save();hide();goTrain()}
function goTrain(){tab='entrenar';render()}
function train(){if(!current())return header('Entrenar')+`<section class="card"><div class="empty"><p>No tenés un entrenamiento en curso.</p><button class="primary" onclick="newWorkout()">Comenzar entrenamiento</button></div></section>`;let s=current(),suggest=library.filter(x=>x.g===s.group&&!s.exercises.some(e=>e.name===x.n)).slice(0,4);return header(s.group,elapsed(s.started))+`<section class="card"><div class="row"><div><h2>Entrenamiento en curso</h2><p class="sub">${completedSets(s)} series efectivas · ${s.exercises.length} ejercicios</p></div><button class="danger mini" onclick="discardDraft()">Descartar</button></div></section>${s.exercises.length?`<section class="card">${s.exercises.map(exerciseHtml).join('')}</section>`:''}<section class="card"><div class="row"><h2>${s.exercises.length?'Añadir ejercicio':'Cómo empezar'}</h2><button class="ghost" onclick="openLibrary(true)">Ver todos</button></div>${suggest.length?`<div class="suggestions">${suggest.map(x=>`<div class="suggestion"><strong>${x.n}</strong><small>${x.v[0]} · ${lastExercise(x.n,x.v[0])?`${lastExercise(x.n,x.v[0]).weight} kg × ${lastExercise(x.n,x.v[0]).reps}`:'Sin historial'}</small><button class="secondary mini" onclick="chooseExercise('${x.n}')">Añadir</button></div>`).join('')}</div>`:''`<p class="sub">Elegí cualquier ejercicio de la biblioteca.</p>`}<div class="actions"><button class="secondary full" onclick="openLibrary(true)">+ Añadir ejercicio</button></div></section><section class="card"><label class="field-label">Nota del día</label><textarea class="note" rows="2" placeholder="Energía, molestias o cualquier detalle" onchange="current().note=this.value;save()">${esc(s.note)}</textarea><div class="actions"><button class="primary full" onclick="finishWorkout()">TERMINAR DÍA</button></div></section>`}
function exerciseHtml(e,ei){let last=lastExercise(e.name,e.variant),group=library.find(x=>x.n===e.name&&x.v.includes(e.variant))?.g||current().group;return `<article class="exercise"><div class="row"><div><div class="exercise-title">${esc(e.name)} · ${esc(e.variant)}</div><div class="exercise-meta">${last?`Última vez: ${last.weight} kg × ${last.reps} · RIR ${last.rir}`:'Primera vez con esta variante'}</div></div><button class="danger mini" onclick="removeExercise(${ei})">Quitar</button></div><div class="set-head"><span>Serie</span><span>Peso</span><span>Reps</span><span>RIR</span><span></span></div>${e.sets.map((x,si)=>`<div class="set ${x.done?'done':''}" data-e="${ei}" data-s="${si}"><span>${si+1}</span>${x.done?`<span>${x.weight} kg</span><span>${x.reps}</span><span>${x.rir}</span><span class="checked">✓</span>`:`${setOptions(x.weight,'weight',group)}${setOptions(x.reps,'reps')}${setOptions(x.rir,'rir')}<button class="check" onclick="completeSet(${ei},${si})">✓</button>`}</div>`).join('')}<div class="actions"><button class="ghost" onclick="addSet(${ei},false)">+ Añadir serie</button><button class="ghost" onclick="addSet(${ei},true)">+ Calentamiento</button></div></article>`}
function elapsed(start){let m=Math.max(0,Math.floor((Date.now()-start)/60000));return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}
function chooseExercise(name){let x=library.find(i=>i.n===name);if(x.v.length===1){addExercise(x.n,x.v[0]);return}show(`<h2>${esc(x.n)}</h2><p class="sub">Elegí una variante para mantener su historial separado.</p><div class="group-grid" style="margin-top:14px">${x.v.map(v=>`<button class="group" onclick="addExercise('${x.n}','${v}')"><strong>${v}</strong><small>${x.c}</small></button>`).join('')}</div>`)}function addExercise(name,variant){let e={id:id(),name,variant,sets:[]};current().exercises.push(e);addSet(current().exercises.length-1,false);save();hide();tab='entrenar';render()}function addSet(ei,warm){let e=current().exercises[ei],prev=[...e.sets].reverse().find(s=>s.done)||lastExercise(e.name,e.variant)||{weight:'0',reps:'8',rir:'2'};e.sets.push({id:id(),weight:String(prev.weight||'0'),reps:String(prev.reps||'8'),rir:String(prev.rir||'2'),warm,done:false});save();render()}function completeSet(ei,si){let row=document.querySelector(`.set[data-e="${ei}"][data-s="${si}"]`),vals={};row.querySelectorAll('[data-field]').forEach(x=>vals[x.dataset.field]=x.value.replace(' kg',''));Object.assign(current().exercises[ei].sets[si],vals,{done:true});save();render();toast('Serie completada')}function removeExercise(i){current().exercises.splice(i,1);save();render()}function discardDraft(){if(confirm('¿Descartar este entrenamiento sin guardarlo?')){state.draft=null;save();render()}}
function finishWorkout(){let s=current(),pending=s.exercises.flatMap(e=>e.sets).filter(x=>!x.done).length;if(!s.exercises.length){toast('Añadí al menos un ejercicio');return}if(pending&&!confirm(`Hay ${pending} serie(s) pendiente(s). ¿Terminar igual?`))return;let prs=[];s.exercises.forEach(e=>e.sets.filter(x=>x.done&&!x.warm).forEach(x=>{let old=[];state.sessions.forEach(os=>os.exercises.forEach(oe=>{if(oe.name===e.name&&oe.variant===e.variant)oe.sets.filter(q=>q.done&&!q.warm).forEach(q=>old.push(q))}));let oldMax=Math.max(0,...old.map(q=>+q.weight||0));if((+x.weight||0)>oldMax&&+x.weight>0)prs.push({name:e.name,variant:e.variant,type:'Mayor peso',value:`${x.weight} kg × ${x.reps}`})}));s.finished=Date.now();s.prs=prs;state.sessions.unshift(s);state.draft=null;save();show(`<h2>✓ Entrenamiento completado</h2><p class="sub">${esc(s.group)} · ${allSets(s)} series · ${elapsed(s.started)}</p>${prs.length?`<section class="card"><h3>🏆 Nuevos récords personales</h3>${prs.map(p=>`<div class="pr">${esc(p.name)} · ${esc(p.variant)}<br>${p.type}: ${p.value}</div>`).join('')}</section>`:''}<section class="card"><h3>Ejercicios realizados</h3>${s.exercises.map(e=>`<div class="history"><strong>${esc(e.name)} · ${esc(e.variant)}</strong><div class="sub">${e.sets.filter(x=>x.done).length} series registradas</div></div>`).join('')}</section><button class="primary full" onclick="hide();setTab('inicio')">VOLVER AL INICIO</button>`)}
function openLibrary(adding){tab='biblioteca';render();window.adding=adding}function libraryView(){return header('Biblioteca')+`<input id="search" class="search" placeholder="Buscar ejercicio" oninput="filterLibrary()"><section class="card"><div id="library-list">${libraryList(library)}</div></section>`}function libraryList(items){return items.map(x=>`<button class="library-item" onclick="${current()?`chooseExercise('${x.n}')`:`showExercise('${x.n}')`}"><span><strong>${esc(x.n)}</strong><small>${esc(x.g)} · ${esc(x.c)}</small></span><span>›</span></button>`).join('')||`<div class="empty">No encontramos ese ejercicio.</div>`}function filterLibrary(){let q=document.querySelector('#search').value.toLowerCase();document.querySelector('#library-list').innerHTML=libraryList(library.filter(x=>(x.n+' '+x.c+' '+x.g).toLowerCase().includes(q)))}function showExercise(name){let x=library.find(q=>q.n===name);show(`<h2>${esc(x.n)}</h2><p class="sub">${esc(x.g)} · ${esc(x.c)}</p><label class="field-label">Variantes</label>${x.v.map(v=>{let p=prFor(x.n,v);return `<div class="history"><strong>${esc(v)}</strong><div class="sub">${p?`PR de peso: ${p.weight} kg`:'Sin historial aún'}</div></div>`}).join('')}`)}
function progress(){let ws=weekSessions(),series=ws.reduce((a,s)=>a+completedSets(s),0),by={};ws.forEach(s=>s.exercises.forEach(e=>{let n=e.sets.filter(x=>x.done&&!x.warm).length;by[s.group]=(by[s.group]||0)+n}));let max=Math.max(1,...Object.values(by));let days=['L','M','X','J','V','S','D'],start=new Date();start.setDate(start.getDate()-((start.getDay()+6)%7));return header('Progreso','Esta semana')+`<section class="card"><div class="row"><h2>Resumen semanal</h2><button class="ghost" onclick="exportWeekly()">Exportar</button></div><div class="stats"><div class="stat"><small>Sesiones</small><strong>${ws.length}</strong></div><div class="stat"><small>Series</small><strong>${series}</strong></div><div class="stat"><small>PR</small><strong>${ws.reduce((a,s)=>a+s.prs.length,0)}</strong></div></div><div class="week">${days.map((d,i)=>{let dt=new Date(start);dt.setDate(start.getDate()+i);let yes=ws.some(s=>s.date===dt.toISOString().slice(0,10));return `<div class="day">${d}<div class="dot ${yes?'yes':''}">${yes?'✓':''}</div></div>`}).join('')}</div></section><section class="card"><h2>Series por grupo</h2>${Object.keys(by).length?Object.entries(by).map(([g,n])=>`<div class="bar-row"><span>${g.replace('Tren ','')}</span><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div><strong>${n}</strong></div>`).join(''):`<div class="empty">Completá un entrenamiento para ver tu semana.</div>`}</section><section class="card"><div class="row"><h2>Historial</h2><span class="sub">${state.sessions.length} días</span></div>${state.sessions.length?state.sessions.map(sessionSnippet).join(''):`<div class="empty">Tu historial aparecerá acá.</div>`}</section>`}
function exportWeekly(){let ws=weekSessions(),out={periodo:'Semana actual',sesiones:ws.length,series_efectivas:ws.reduce((a,s)=>a+completedSets(s),0),duracion_minutos:ws.reduce((a,s)=>a+Math.round((s.finished-s.started)/60000),0),pr:ws.flatMap(s=>s.prs),entrenamientos:ws.map(s=>({fecha:s.date,grupo:s.group,ejercicios:s.exercises.map(e=>({ejercicio:e.name,variante:e.variant,series_efectivas:e.sets.filter(x=>x.done&&!x.warm).length}))}))};let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resumen-entrenamiento-semanal.json';a.click();URL.revokeObjectURL(a.href);toast('Resumen semanal exportado')}
function show(content){document.querySelector('#overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)hide()"><section class="sheet">${content}<div class="actions"><button class="secondary full" onclick="hide()">Cerrar</button></div></section></div>`}function hide(){document.querySelector('#overlay').innerHTML=''}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1800)}function setTab(t){tab=t;render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));render();if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
